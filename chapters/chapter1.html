<title>මහින්දගේ තැපැල් කාර්යාලය: 1 වන පරිච්ඡේදය</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EEF3F9;--surface:#FFFFFF;--surface-2:#F6F9FD;--ink:#1D2944;--muted:#58668A;--line:#D5DEEB;
  --red:#D93A3A;--blue:#2356C4;--gold:#E9A92B;--green:#23946A;
  --red-soft:#FBE4E4;--blue-soft:#E2EAFB;--gold-soft:#FCF0D5;--green-soft:#DDF3EA;
  --shadow:0 2px 0 rgba(29,41,68,.08),0 14px 30px -14px rgba(29,41,68,.3);
  --f-display:"Familjen Grotesk","Noto Sans Sinhala",system-ui,sans-serif;
  --f-body:"Noto Sans Sinhala","Familjen Grotesk",system-ui,-apple-system,sans-serif;
  --f-stamp:"JetBrains Mono","Noto Sans Sinhala",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111827;--surface:#1A2336;--surface-2:#1F2A40;--ink:#E9EEF8;--muted:#9DAACA;--line:#2D3A55;
    --red:#FF6E6E;--blue:#79A2FF;--gold:#F4C35E;--green:#4CCB97;
    --red-soft:#3A1F27;--blue-soft:#1E2B4D;--gold-soft:#3A3020;--green-soft:#18352C;
    --shadow:0 2px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#111827;--surface:#1A2336;--surface-2:#1F2A40;--ink:#E9EEF8;--muted:#9DAACA;--line:#2D3A55;
  --red:#FF6E6E;--blue:#79A2FF;--gold:#F4C35E;--green:#4CCB97;
  --red-soft:#3A1F27;--blue-soft:#1E2B4D;--gold-soft:#3A3020;--green-soft:#18352C;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.airmail{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,transparent 14px 22px,var(--blue) 22px 36px,transparent 36px 44px)}
.mono{font-family:var(--f-stamp)}
.num{font-variant-numeric:tabular-nums}
.term{font-weight:700;color:var(--blue)}
.formula{font-family:var(--f-stamp);font-weight:600;background:var(--blue-soft);color:var(--ink);padding:1px 7px;border-radius:6px}

.route{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.route .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{flex:none;text-decoration:none;font-weight:700;font-size:14px;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;white-space:nowrap}
.back:hover{background:var(--blue-soft)}
.stops{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.stops::-webkit-scrollbar{display:none}
.stops a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:5px 11px;border-radius:999px;border:1.5px solid transparent;display:flex;align-items:center;gap:6px}
.stops a .dot{width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.stops a.done .dot{background:var(--green);border-color:var(--green)}
.stops a.here{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--red);transition:width .4s}

main{padding-block:26px 40px}
.scene{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.act{font-family:var(--f-stamp);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--red);font-weight:700}
.scene h2{font-size:clamp(26px,4.2vw,36px);margin-top:4px}
.narr{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:end;margin-top:18px}
.narr .pip{width:78px}
.bubble{background:var(--gold-soft);border:2px solid var(--gold);border-radius:18px 18px 18px 4px;padding:12px 16px;font-weight:500;line-height:1.55}
.bubble b{font-weight:700}
.ask{margin-top:18px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ask .q{padding:16px 18px 6px;font-family:var(--f-display);font-size:20px;font-weight:700}
.ask .opts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 18px 16px}
.opt{cursor:pointer;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15.5px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.ask .fb{padding:0 18px 16px;font-weight:700}
.ask .skip{cursor:pointer;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;font-weight:700;padding:0 18px 14px}
.reveal{margin-top:18px;display:flex;flex-direction:column;gap:16px;animation:unfold .55s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-10px) scaleY(.96);transform-origin:top}to{opacity:1;transform:none}}
.card{background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:20px;margin-bottom:8px}
.card .sub{color:var(--muted);font-size:15px;margin-bottom:10px}
.card p+p{margin-top:10px}
.card ul{margin:8px 0 0;padding-left:20px}
.card li+li{margin-top:4px}
.analogy{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:15.5px;line-height:1.5}
.analogy::before{content:"";flex:none;width:26px;height:18px;margin-top:2px;border-radius:3px;background:linear-gradient(155deg,transparent 48%,var(--gold) 49% 55%,transparent 56%),linear-gradient(25deg,transparent 48%,var(--gold) 49% 55%,transparent 56%),var(--surface);border:2px solid var(--gold)}
.keyidea{border-left:5px solid var(--blue);background:var(--blue-soft);border-radius:0 14px 14px 0;padding:12px 16px;font-weight:700}
.scene-nav{margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:16px}
.scene-nav .count{font-family:var(--f-stamp);font-weight:700;color:var(--muted)}
.btn{cursor:pointer;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:700;font-size:15.5px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--red) 55%,#000)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 color-mix(in srgb,var(--red) 55%,#000),0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}}

.pip{width:100%;height:auto;display:block;cursor:pointer}
.pip .arm{transform-origin:86px 92px;animation:wave 2.6s ease-in-out infinite}
.pip .bob{animation:bob 2.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-16deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pip.cheer .bob{animation:jump .5s ease 2}
@keyframes jump{50%{transform:translateY(-12px)}}

.cover{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:center;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.cover .txt{padding:28px 0 28px 28px}
.cover h1{font-size:clamp(30px,5vw,48px);font-weight:700;margin-top:6px}
.cover h1 em{font-style:normal;color:var(--blue)}
.cover .lede{margin-top:12px;color:var(--muted);font-size:17.5px;max-width:52ch}
.cover .go{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.cover .art{padding:20px 24px 20px 0}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.cast div{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.cast b{display:block;font-family:var(--f-display);font-size:16px;font-weight:700}
.cast span{color:var(--muted)}

.journey{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 14px}
.journey h3{font-size:19px;margin:2px 4px 6px}
.jv{overflow-x:auto;border-radius:12px;background:var(--surface-2)}
.jv svg{display:block;width:100%;min-width:560px;height:auto}
.jv text{font-family:var(--f-body);font-weight:700;fill:var(--ink)}
.jv .lbl{font-family:var(--f-display);font-weight:700;font-size:14px}
.jv .sublbl{font-size:12px;fill:var(--muted);font-weight:500}
.jv .lnk{stroke:var(--muted);stroke-width:3;stroke-dasharray:7 7;fill:none;opacity:.7}
.jv .lnk.hot{stroke:var(--red);opacity:1;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
.jv .lnklbl{font-size:12px;fill:var(--muted);font-weight:700}
.jv .shape{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.jv .shape.soft{fill:var(--blue-soft);stroke:var(--blue)}
.jv .shape.danger{fill:var(--red-soft);stroke:var(--red)}
.jv .roofbar{fill:var(--blue)}
.jv .envbox{fill:var(--surface);stroke:var(--red);stroke-width:2.5}
.jv .envflap{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linejoin:round}
.jv .envlbl{font-family:var(--f-stamp);font-size:12.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:5px;stroke-linejoin:round}
.jv .fxt{font-size:12.5px;font-weight:700}
.jv .pop{animation:popin .35s ease}
@keyframes popin{from{opacity:0}to{opacity:1}}
.jcap{margin-top:12px;background:var(--blue-soft);border-radius:12px;padding:12px 14px;min-height:76px;line-height:1.55}
.jcap b.n{color:var(--blue)}
.jnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--red)}
.jbtns{display:flex;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14.5px}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.detail{margin-top:12px;border-left:4px solid var(--red);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 14px;min-height:90px;animation:popin .3s}
.detail h4{font-size:18px;margin-bottom:4px}
.dict{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.dict div{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.4}
.dict b{display:block;font-family:var(--f-display);font-weight:700;font-size:16px}
.dict span{color:var(--muted)}
.ctrl{display:grid;grid-template-columns:190px 1fr 100px;gap:10px;align-items:center;margin-top:8px;font-size:15px}
.ctrl label{font-weight:700}
.ctrl output{font-family:var(--f-stamp);font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--blue)}
input[type=text]{width:100%;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.envs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.env{position:relative;width:98px;height:64px;background:var(--surface-2);border:2px solid var(--ink);border-radius:6px;padding:20px 6px 4px;font-family:var(--f-stamp);font-size:12.5px;line-height:1.25;overflow:hidden;animation:popin .3s ease}
.env::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:24px;background:linear-gradient(160deg,transparent 49%,var(--ink) 50% 54%,transparent 55%) left/50% 100% no-repeat,linear-gradient(20deg,transparent 49%,var(--ink) 50% 54%,transparent 55%) right/50% 100% no-repeat}
.env .n{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-weight:700;border-radius:4px;padding:0 4px;font-size:11px}
.env .body{white-space:pre;overflow:hidden}
.road{position:relative;height:58px;margin-top:12px;border-radius:12px;background:var(--surface-2);border:2px dashed var(--line);overflow:hidden}
.road .tag{position:absolute;font-size:12px;font-weight:700;color:var(--muted);top:4px}
.road .m{position:absolute;top:22px;left:6px;width:30px;height:21px;background:var(--surface);border:2px solid var(--red);border-radius:3px}
.road .m::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,transparent 47%,var(--red) 48% 56%,transparent 57%) left/50% 60% no-repeat,linear-gradient(30deg,transparent 47%,var(--red) 48% 56%,transparent 57%) right/50% 60% no-repeat}
.road.go .m{animation:drive var(--d,1.6s) linear forwards}
.road.go .m.wob{animation:drive var(--d,1.6s) linear forwards,wob .25s ease-in-out infinite}
@keyframes drive{from{left:6px}to{left:calc(100% - 40px)}}
@keyframes wob{50%{margin-top:-5px}}
.lane{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center}
.lane .road{margin-top:6px;height:40px}
.lane .road .m{top:8px}
.lane b{font-size:14.5px}
.bin{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px;border:2px solid var(--ink);border-radius:12px;background:var(--surface-2);margin-top:10px}
.bin span{aspect-ratio:1;border-radius:5px;border:1.5px dashed var(--line)}
.bin span.full{background:var(--gold);border:1.5px solid var(--ink)}
.bin.overflow{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-stamp);font-size:22px}
.stat small{color:var(--muted);font-size:12.5px;font-weight:700}
.stat.bad b{color:var(--red)} .stat.good b{color:var(--green)}
.svgbox{overflow-x:auto;background:var(--surface-2);border-radius:12px;margin-top:10px}
.svgbox svg{display:block;width:100%;max-width:720px;margin:0 auto;height:auto}
.svgbox text{font-family:var(--f-body);font-weight:700;fill:var(--ink)}
.dbars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dbar{display:grid;grid-template-columns:118px 1fr 96px;gap:8px;align-items:center;font-size:14px;font-weight:700}
.dbar .track{height:16px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dbar .fill{height:100%;border-radius:99px;transition:width .25s}
.dbar output{font-family:var(--f-stamp);text-align:right}
.total{margin-top:12px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;border-top:2px dashed var(--line);padding-top:10px}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.layer b{font-family:var(--f-display);font-size:17px;font-weight:700}
.layer small{color:var(--muted);font-size:14px;line-height:1.4}
.layer[aria-expanded="true"]{border-color:var(--blue);background:var(--blue-soft)}
.layer .more{grid-column:1/-1;font-size:15px;line-height:1.5}
.encap{margin-top:12px;min-height:120px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:12px;padding:12px;overflow-x:auto}
.box{border:2.5px solid;border-radius:10px;padding:6px 8px 8px;display:flex;gap:6px;align-items:stretch;animation:popin .3s}
.box>.h{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-stamp);font-weight:700;font-size:12px;padding:4px 2px;border-radius:5px;color:#fff;text-align:center}
.box.m{border-color:var(--gold);background:var(--gold-soft);font-weight:700;padding:12px 16px;align-items:center}
.box.t{border-color:var(--green)} .box.t>.h{background:var(--green)}
.box.n{border-color:var(--blue)} .box.n>.h{background:var(--blue)}
.box.lk{border-color:var(--red)} .box.lk>.h{background:var(--red)}
.bits{font-family:var(--f-stamp);font-weight:700;font-size:15px;letter-spacing:.08em;word-break:break-all;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;font-size:14.5px}
.flow span{background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:3px 9px}
.flow i{font-style:normal;color:var(--muted)}
table.trace{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.trace th{text-align:left;color:var(--muted);padding:6px}
table.trace td{padding:6px;border-top:1px dashed var(--line)}
table.trace tr[data-i]{cursor:pointer}
table.trace tr[data-i]:hover{background:var(--surface-2)}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.era{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:12px 8px;text-align:center;position:relative}
.era::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--line);border-radius:3px;pointer-events:none}
.era b{display:block;font-family:var(--f-display);font-size:16px;color:var(--red)}
.era small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:4px}
.era[aria-pressed="true"]{border-color:var(--red);transform:rotate(-2deg);background:var(--red-soft)}
.stampgrid{display:flex;gap:8px;flex-wrap:wrap}
.pstamp{width:54px;height:54px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-stamp);font-weight:700;font-size:11px;color:var(--muted);text-align:center;line-height:1.1}
.pstamp.on{border:2px solid var(--green);color:var(--green);background:var(--green-soft);transform:rotate(-8deg)}
footer{padding-block:10px 40px;color:var(--muted);font-size:14px}

@media (max-width:700px){
  .cover{grid-template-columns:1fr}

 say:"පැරණි දුරකථන ජාලයට වෙනස් අදහසක් තිබුණි: සෑම සංවාදයක් සඳහාම ආරම්භයේ සිට අවසානය දක්වාම පුද්ගලික මංතීරුවක් වෙන් කර තැබීම (Circuit switching).",
 ask:{q:"1 Gb/s මාර්ගයක් ඇත. සෑම පරිශීලකයෙකුටම ක්‍රියාකාරී වන විට 100 Mb/s අවශ්‍ය වේ, නමුත් ඔවුන් ක්‍රියාකාරී වන්නේ කාලයෙන් 10% ක් පමණි. හවුලේ භාවිතා කරන්නේ නම් පරිශීලකයන් කී දෙනෙකුට පහසුවෙන් එය භාවිතා කළ හැකිද?",opts:["10 දෙනෙකුට","35 දෙනෙකුට පමණ","1000 දෙනෙකුට"],correct:1,why:"මංතීරු වෙන් කළහොත් (Circuit switching) යා හැක්කේ 10 දෙනෙකුට පමණි. නමුත් බොහෝ දෙනා බොහෝ වේලාවට නිහඬව සිටින නිසා හවුලේ භාවිතා කිරීමෙන් (Packet switching) 35 දෙනෙකුට පමණ පහසුකම් සැලසිය හැක."},
 init(r){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>Circuit switching: පුද්ගලික වෑන් රථයක්</h3>
  <p>ඇමතුමක් සඳහා සම්පත් <b>වෙන් කරනු ලැබේ (Reserved)</b>. ඔබට ස්ථාවර වේගයක් ලැබෙන නමුත් ඔබ කතා නොකරන විට එම මංතීරුව <b>අක්‍රියව (Idle)</b> පවතී. බෙදා ගැනීමක් නැත. මේ සඳහා <b>FDM</b> (සංඛ්‍යාත බෙදීම) හෝ <b>TDM</b> (කාල කවුළු බෙදීම) භාවිතා කරයි.</
