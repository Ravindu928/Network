<title>Application Post Office</title>

<style>
/* Layout: a storybook. One scene on the stage at a time: story, then a question, then the discovery (a letter travelling), then the takeaway. Route of 8 stamps on top, Penny bottom-right. */
:root{
  --paper:#EEF3F9;--card:#FFFFFF;--ink:#1D2944;--muted:#58668A;--line:#CDD7E6;
  --red:#D93A3A;--blue:#2356C4;--gold:#E9A92B;--green:#23946A;
  --soft-red:#FCE3E1;--soft-blue:#E0EAF8;--soft-gold:#FDF0D3;--soft-green:#DCF2E8;--code-bg:#F7F4EC;
  --shadow:0 2px 0 rgba(29,41,68,.08),0 10px 28px rgba(29,41,68,.10);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827;--card:#1A2336;--ink:#E9EEF8;--muted:#A3B1C9;--line:#2F3D58;
  --red:#FF6E6E;--blue:#79A2FF;--gold:#F4C35E;--green:#4CCB97;
  --soft-red:#3A2225;--soft-blue:#1F3152;--soft-gold:#3A3020;--soft-green:#1D3A2C;--code-bg:#162036;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827;--card:#1A2336;--ink:#E9EEF8;--muted:#A3B1C9;--line:#2F3D58;
  --red:#FF6E6E;--blue:#79A2FF;--gold:#F4C35E;--green:#4CCB97;
  --soft-red:#3A2225;--soft-blue:#1F3152;--soft-gold:#3A3020;--soft-green:#1D3A2C;--code-bg:#162036;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--blue)}
button{font-family:var(--f-display);font-size:1rem;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--f-type)}

.airmail{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 16px,var(--card) 16px 26px,var(--blue) 26px 42px,var(--card) 42px 52px)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{padding-block:22px 6px}
.backlink{display:inline-block;font-family:var(--f-display);font-weight:600;text-decoration:none;color:var(--blue);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 14px;box-shadow:var(--shadow);font-size:.95rem}
.backlink:hover{border-color:var(--blue)}
.eyebrow{font-family:var(--f-type);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-size:.8rem;margin-top:16px}
header h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:700;margin-top:4px}
header h1 span{color:var(--blue)}

.route{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}
.stop-btn{background:var(--card);border:2px dashed var(--line);border-radius:6px;padding:6px 2px;color:var(--ink);font-size:.72rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.stop-btn b{font-size:1.05rem;color:var(--muted)}
.stop-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stop-btn.here{border-style:solid;border-color:var(--blue);background:var(--soft-blue)}
.stop-btn.here b{color:var(--blue)}
.stop-btn.done b{color:var(--green)}
.stop-btn.done{border-color:var(--green)}
.trail{height:6px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.trail i{display:block;height:100%;background:var(--red);transition:width .4s}

main{padding-block:18px 150px}
.scene{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:clamp(18px,4vw,30px);animation:enter .35s ease}
@keyframes enter{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--f-type);font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.scene h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:600;margin-top:4px}
.story{margin-top:12px;font-size:1.08rem;max-width:62ch}
.story b{color:var(--blue)}
.ask{margin-top:18px;background:var(--soft-gold);border-radius:16px;padding:16px 18px}
.ask .q{font-family:var(--f-display);font-weight:500;font-size:1.2rem;display:flex;gap:10px;align-items:flex-start}
.ask .q::before{content:"?";flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1D2944;display:grid;place-items:center;font-weight:700}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--soft-green);border-color:var(--green)}
.opt.wrong{background:var(--soft-red);border-color:var(--red)}
.opt:disabled{cursor:default}
.verdict{margin-top:10px;font-size:.98rem}
.verdict b{font-family:var(--f-display);font-weight:600}
.reveal{margin-top:20px;display:flex;flex-direction:column;gap:16px;animation:enter .45s ease}
.takeaway{border:2px dashed var(--green);border-radius:14px;padding:12px 16px;background:var(--soft-green)}
.takeaway b{font-family:var(--f-display);font-weight:600;color:var(--green)}
.note{background:var(--soft-blue);border-radius:12px;padding:12px 14px;font-size:.98rem}
.note b{font-family:var(--f-display);font-weight:600}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .count{font-family:var(--f-type);font-size:.85rem;color:var(--muted)}
.btn{background:var(--red);color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--blue)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;align-self:flex-start;background:var(--soft-blue);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--ink);padding:7px 14px;border-radius:9px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);color:var(--blue)}

.trip{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--paper)}
.trip .sv{overflow-x:auto}
.trip svg{width:100%;min-width:560px;height:auto;display:block}
.trip text{font-family:var(--f-display);fill:var(--ink)}
.trip .cap{min-height:3.3em;background:var(--card);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:1rem}
.trip .cap b{font-family:var(--f-display);font-weight:600;color:var(--red)}
.trip .ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:100%}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--red)}
.counter{font-family:var(--f-type);font-weight:700;font-size:.9rem;background:var(--soft-gold);border-radius:8px;padding:2px 10px}
.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

.letter{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--f-type);font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.letter .k{color:var(--blue);font-weight:700}
.letter .r{color:var(--red);font-weight:700}
.letter .g{color:var(--green);font-weight:700}
select,input[type=text]{font:inherit;font-size:.95rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--red)}
label{font-weight:700;font-size:.95rem}

.meter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter>div{background:var(--soft-blue);border-radius:12px;padding:12px;min-width:0}
.meter .big{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter .lbl{font-size:.82rem;color:var(--muted)}
.gauge{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;transition:width .3s,background .3s}

.frames{display:flex;gap:4px;flex-wrap:wrap}
.frames i{width:26px;height:26px;border-radius:5px;opacity:.22;transition:opacity .2s,transform .2s;display:grid;place-items:center;font-style:normal;font-size:.62rem;color:#fff;font-family:var(--f-type);font-weight:700}
.frames i.sent{opacity:1;transform:scale(1.06)}
.o1{background:var(--blue)}.o2{background:var(--red)}.o3{background:var(--green)}.o4{background:#B07A12}

.smtp{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;padding:4px}
.smtp div{font-family:var(--f-type);font-size:.88rem;padding:6px 10px;border-radius:10px;max-width:88%;animation:enter .25s ease}
.smtp .S{background:var(--soft-blue);align-self:flex-start}
.smtp .C{background:var(--soft-red);align-self:flex-end}

.cards{display:flex;flex-wrap:wrap;gap:8px}
.cards button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 16px;color:var(--ink);font-weight:700;font-size:1.1rem}
.cards button[aria-pressed="true"]{border-color:var(--blue);background:var(--soft-blue)}

.peers{display:flex;flex-direction:column;gap:8px}
.peer{background:var(--soft-blue);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.peer>div{min-width:0}
.peer .nm{font-family:var(--f-display);font-weight:600;font-size:.9rem}
.peer.me{background:var(--soft-gold)}
.chunks{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.chunks i{height:26px;border-radius:4px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:.68rem;font-family:var(--f-type);color:var(--muted)}
.chunks i.have{background:var(--blue);color:#fff}
.chunks i.new{background:var(--red);color:#fff;animation:pulse .5s}
.counts{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;font-family:var(--f-type);font-size:.78rem;text-align:center;color:var(--muted)}

.quality{display:flex;gap:6px;align-items:flex-end;height:110px}
.quality div{flex:1;min-width:0;border-radius:8px 8px 0 0;background:var(--soft-blue);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.72rem;padding:4px 2px;text-align:center;color:var(--muted);transition:background .3s}
.quality div.pick{background:var(--red);color:#fff}
.quality div.ok{background:var(--soft-green);color:var(--ink)}

pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-family:var(--f-type);font-size:.86rem;line-height:1.5;margin:0}
pre.code .c{color:var(--muted);font-style:italic}
pre.code .k{color:var(--red);font-weight:700}
pre.code .s{color:var(--green)}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-display)}

.scoreline{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.scoreline i{width:22px;height:14px;border-radius:3px;background:var(--line)}
.scoreline i.r{background:var(--green)}.scoreline i.w{background:var(--red)}
.qtext{font-family:var(--f-display);font-size:1.3rem;font-weight:500;margin-block:6px 12px}

footer{padding-block:0 40px;color:var(--muted);font-size:.85rem}

.carrier{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.carrier>*{pointer-events:auto}
.bubble{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:290px;font-size:.92rem;line-height:1.45;box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
.bubble.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.bubble .who{font-family:var(--f-display);font-weight:600;color:var(--red);font-size:.8rem;display:flex;justify-content:space-between;gap:10px}
.bubble .x{background:none;border:none;color:var(--muted);font-size:1rem;padding:0 2px;line-height:1}
.carrier-btn{background:var(--card);border:3px solid var(--ink);border-radius:50%;width:80px;height:80px;padding:0;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}
.carrier-btn svg{width:78px;height:78px;animation:bob 3s ease-in-out infinite}
.carrier-btn.talk svg{animation:hop .5s ease}
@keyframes bob{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-8px) rotate(-4deg)}100%{transform:translateY(0)}}

@media (max-width:640px){
  body{font-size:16px}
  .route{grid-template-columns:repeat(4,1fr)}
  .meter{grid-template-columns:1fr}
  .bubble{max-width:calc(100vw - 120px);font-size:.85rem}
  .carrier-btn{width:64px;height:64px}.carrier-btn svg{width:62px;height:62px}
  .peer{grid-template-columns:1fr}
}
</style>

<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function h(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Penny ---------- */
const bubble=$("#bubble"),bt=$("#bubbleText"),cbtn=$("#carrierBtn");
let hintLine="";
function say(t){bt.textContent=t;bubble.classList.remove("hide");cbtn.classList.remove("talk");void cbtn.offsetWidth;cbtn.classList.add("talk")}
cbtn.onclick=()=>say(hintLine||"Read the story, make a guess, then watch the letter travel.");
$("#bubbleX").onclick=()=>bubble.classList.add("hide");

/* ---------- Trip engine: a letter travelling step by step ---------- */
function drawNode(svg,n){
  const g=svgEl("g",{transform:`translate(${n.x},${n.y})`},svg);
  const inner=svgEl("g",{},g);
  const k=n.kind||"house";
  if(k==="house"){
    svgEl("rect",{x:-26,y:-12,width:52,height:36,rx:3,fill:"var(--card)",stroke:"var(--ink)","stroke-width":2},inner);
    svgEl("path",{d:"M-32 -9 L0 -36 L32 -9 Z",fill:n.color||"var(--red)",stroke:"var(--ink)","stroke-width":2},inner);
    svgEl("rect",{x:-7,y:6,width:14,height:18,fill:"var(--gold)",stroke:"var(--ink)","stroke-width":1.5},inner);
  }else if(k==="office"){
    svgEl("rect",{x:-40,y:-26,width:80,height:52,rx:4,fill:"var(--card)",stroke:"var(--ink)","stroke-width":2},inner);
    svgEl("rect",{x:-44,y:-36,width:88,height:14,rx:2,fill:n.color||"var(--blue)",stroke:"var(--ink)","stroke-width":2},inner);
    for(let i=0;i<3;i++)svgEl("rect",{x:-30+i*22,y:-12,width:16,height:12,rx:2,fill:"var(--soft-gold)",stroke:"var(--ink)","stroke-width":1.2},inner);
    svgEl("rect",{x:-9,y:6,width:18,height:20,fill:"var(--soft-blue)",stroke:"var(--ink)","stroke-width":1.5},inner);
  }else if(k==="door"){
    svgEl("rect",{x:-18,y:-24,width:36,height:48,rx:4,fill:n.color||"var(--soft-blue)",stroke:"var(--ink)","stroke-width":2},inner);
    svgEl("circle",{cx:10,cy:2,r:2.5,fill:"var(--ink)"},inner);
    if(n.num){const t=svgEl("text",{x:0,y:-8,"text-anchor":"middle","font-size":12,"font-weight":700},inner);t.textContent=n.num}
  }else if(k==="box"){
    svgEl("rect",{x:-40,y:-20,width:80,height:40,rx:10,fill:n.color||"var(--soft-blue)",stroke:"var(--ink)","stroke-width":2},inner);
  }
  const ly=k==="box"?36:k==="office"?44:40;
  const t=svgEl("text",{x:0,y:ly,"text-anchor":"middle","font-size":13,"font-weight":600},g);t.textContent=n.label||"";
  if(n.sub){const t2=svgEl("text",{x:0,y:ly+15,"text-anchor":"middle","font-size":11,style:"fill:var(--muted);font-family:var(--f-type)"},g);t2.textContent=n.sub}
  if(n.inside){const t3=svgEl("text",{x:0,y:4,"text-anchor":"middle","font-size":11,"font-weight":600},g);t3.textContent=n.inside}
  return inner;
}
function trip(cfg){
  const W=cfg.w||640,H=cfg.h||250;
  const root=h(`<div class="trip"><div class="sv"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label||"A letter travelling between places")}"></svg></div><div class="cap"></div><div class="ctl"><div class="row"><div class="dots"></div>${cfg.counter?'<span class="counter"></span>':""}</div><div class="row"><button class="btn ghost" data-b="back">Back</button><button class="btn ghost" data-b="play">Play all</button><button class="btn" data-b="next">Send the letter</button></div></div></div>`);
  const svg=root.querySelector("svg"),cap=root.querySelector(".cap"),dots=root.querySelector(".dots"),cnt=root.querySelector(".counter");
  const N=cfg.nodes,nodeEls={};
  const seen=new Set();
  cfg.steps.forEach(s=>{if(s.from===s.to)return;const k=[s.from,s.to].sort().join("|");if(seen.has(k))return;seen.add(k);const a=N[s.from],b=N[s.to];svgEl("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"var(--line)","stroke-width":3,"stroke-dasharray":"6 6","data-k":k},svg)});
  for(const id in N)nodeEls[id]=drawNode(svg,N[id]);
  const env=svgEl("g",{},svg);
  const envBody=svgEl("g",{},env);
  const envRect=svgEl("rect",{x:-16,y:-11,width:32,height:22,rx:3,fill:"var(--card)",stroke:"var(--red)","stroke-width":2.5},envBody);
  const envFlap=svgEl("path",{d:"M-16 -11 L0 2 L16 -11",fill:"none",stroke:"var(--red)","stroke-width":2.5},envBody);
  const tagBg=svgEl("rect",{x:-40,y:-36,width:80,height:18,rx:9,fill:"var(--ink)"},env);
  const tag=svgEl("text",{x:0,y:-23,"text-anchor":"middle","font-size":11,"font-weight":700,style:"fill:var(--card);font-family:var(--f-type)"},env);
  const lostTxt=svgEl("text",{x:0,y:28,"text-anchor":"middle","font-size":13,"font-weight":700,style:"fill:var(--red)",opacity:0},env);lostTxt.textContent="lost!";
  let i=-1,playing=null,busy=false;
  function setTag(s){tag.textContent=s||"";const w=Math.max(40,(s||"").length*6.8+16);tagBg.setAttribute("x",-w/2);tagBg.setAttribute("width",w);tagBg.setAttribute("opacity",s?1:0)}
  function place(p){env.setAttribute("transform",`translate(${p[0]},${p[1]})`)}
  function style(card){envFlap.setAttribute("opacity",card?0:1);envRect.setAttribute("stroke",card?"var(--blue)":"var(--red)")}
  function hilite(s){$$("line",svg).forEach(l=>{l.setAttribute("stroke","var(--line)");l.setAttribute("stroke-width",3)});if(s&&s.from!==s.to){const l=svg.querySelector(`line[data-k="${[s.from,s.to].sort().join("|")}"]`);if(l){l.setAttribute("stroke",s.lost?"var(--muted)":"var(--red)");l.setAttribute("stroke-width",4)}}}
  function pulse(id){const e=nodeEls[id];if(!e)return;e.classList.remove("pulse");e.style.transformBox="fill-box";e.style.transformOrigin="center";void e.getBBox();e.classList.add("pulse")}
  function ui(){
    const s=cfg.steps[i];
    cap.innerHTML=i<0?(cfg.intro||"Press <b>Send the letter</b> and follow Penny."):`<b>${i+1}.</b> ${s.cap}`;
    dots.innerHTML=cfg.steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("");
    if(cnt)cnt.textContent=cfg.counter(i);
    root.querySelector('[data-b="back"]').disabled=i<0;
    root.querySelector('[data-b="next"]').textContent=i<0?"Send the letter":i>=cfg.steps.length-1?"Start over":"Next step";
  }
  function show(k,anim,done){
    i=k;ui();
    if(i<0){const f=N[cfg.steps[0].from];setTag(cfg.steps[0].tag);style(cfg.steps[0].card);hilite(null);place([f.x,f.y]);lostTxt.setAttribute("opacity",0);env.setAttribute("opacity",1);done&&done();return}
    const s=cfg.steps[i],a=N[s.from],b=N[s.to];
    setTag(s.tag);style(s.card);hilite(s);lostTxt.setAttribute("opacity",0);env.setAttribute("opacity",1);
    const from=[a.x,a.y],to=s.lost?[(a.x+b.x)/2,(a.y+b.y)/2]:[b.x,b.y];
    const finish=()=>{busy=false;if(s.lost){lostTxt.setAttribute("opacity",1);env.setAttribute("opacity",.45)}else pulse(s.to);if(i===cfg.steps.length-1&&cfg.onDone)cfg.onDone();done&&done()};
    if(!anim||reduce||s.from===s.to){place(to);finish();return}
    busy=true;const t0=performance.now(),D=s.lost?700:850;
    (function f(t){const p=Math.min(1,(t-t0)/D),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;place([from[0]+(to[0]-from[0])*e,from[1]+(to[1]-from[1])*e-Math.sin(Math.PI*p)*22]);if(p<1)requestAnimationFrame(f);else finish()})(performance.now());
  }
  const playBtn=root.querySelector('[data-b="play"]');
  function stop(){if(playing!==null){clearTimeout(playing);playing=null;playBtn.textContent="Play all"}}
  root.querySelector('[data-b="next"]').onclick=()=>{if(busy)return;stop();show(i>=cfg.steps.length-1?-1:i+1,true)};
  root.querySelector('[data-b="back"]').onclick=()=>{if(busy)return;stop();show(i-1,false)};
  playBtn.onclick=()=>{if(playing!==null){stop();return}if(busy)return;playBtn.textContent="Pause";playing=0;if(i>=cfg.steps.length-1)show(-1,false);
    const go=()=>{if(playing===null)return;if(i>=cfg.steps.length-1){stop();return}show(i+1,true,()=>{if(playing!==null)playing=setTimeout(go,650)})};go()};
  show(-1,false);
  return root;
}

function seg(labels,onPick,start=0){const s=h(`<div class="seg" role="group">${labels.map((l,i)=>`<button aria-pressed="${i===start}">${l}</button>`).join("")}</div>`);$$("button",s).forEach((b,i)=>b.onclick=()=>{$$("button",s).forEach(x=>x.setAttribute("aria-pressed",x===b));onPick(i)});return s}
function slot(){return document.createElement("div")}

/* ---------- SCENES ---------- */
const STOPS=["Meet the post office","The Web","Email","DNS","Sharing","Video","Sockets","Quiz"];
const S=[];

S.push({stop:0,title:"A letter needs someone to answer it",
 story:"It's 8 pm. <b>Alice</b> sits in her dorm room and opens her browser. Without knowing it, she is about to write a letter, and Penny is waiting at the door to carry it. Every Internet app works like this: a <b>process</b> on one computer sends messages to a process on another.",
 ask:{q:"Alice's browser and a web server want to talk. Who writes the first letter?",opts:["The server, to say hello","Alice's browser, the client","Whoever is faster"],ans:1,why:"The client always starts. The server is always on, at a permanent address, waiting for letters."},
 body(el){el.append(trip({nodes:{a:{x:90,y:150,label:"Alice",sub:"client"},s:{x:540,y:140,kind:"office",label:"Web server",sub:"always on"},b:{x:300,y:200,label:"Bob",sub:"client",color:"var(--blue)"}},
  steps:[{from:"a",to:"s",tag:"request",cap:"Alice's browser (the <b>client</b>) sends a request letter to the server."},{from:"s",to:"a",tag:"response",cap:"The server answers. It never writes first."},{from:"b",to:"s",tag:"request",cap:"Bob, another client, writes to the same server. Clients never write to each other."},{from:"s",to:"b",tag:"response",cap:"One server, many clients. This is the <b>client–server</b> design. HTTP and IMAP work this way."}]}))},
 take:"Client–server: an always-on server with a fixed IP address, often in a data center. Clients connect when they want, may change address, and don't talk to each other directly.",
 penny:"Welcome! I'm Penny. Tonight we follow every letter Alice sends. Make a guess first, then watch what happens."});

S.push({stop:0,title:"What if there's no post office at all?",
 story:"Alice's friends want to share a huge file. Nobody has a server. Can they still send letters?",
 ask:{q:"With no server, how can the file move around?",opts:["It can't. You always need a server","Friends pass pieces straight to each other","Penny keeps a copy in her bag"],ans:1,why:"In peer-to-peer (P2P), peers ask each other for service and give service back."},
 body(el){el.append(trip({h:260,nodes:{a:{x:110,y:70,label:"Alice"},b:{x:530,y:70,label:"Bob",color:"var(--blue)"},c:{x:530,y:200,label:"Carol"},d:{x:110,y:200,label:"Dave",color:"var(--blue)"}},
  steps:[{from:"a",to:"b",tag:"piece 1",cap:"Alice sends piece 1 straight to Bob. No middleman."},{from:"b",to:"c",tag:"piece 1",cap:"Bob passes piece 1 on to Carol. Bob is downloading <b>and</b> uploading."},{from:"c",to:"d",tag:"piece 2",cap:"Carol sends Dave a piece she has."},{from:"d",to:"a",tag:"piece 3",cap:"Dave sends something back to Alice. Every new friend brings new upload capacity. That's <b>self-scalability</b>."}]}))},

 penny:"Neighbors handing letters over the fence. That's P2P!"});

S.push({stop:0,title:"A building with 65,535 doors",

  const sel=h(`<div class="row"><label for="appSel">Alice wants to reach the</label><select id="appSel"><option value="80">web server (HTTP)</option><option value="25">mail server (SMTP)</option><option value="53">name server (DNS)</option></select></div>`);

let tcpMode=0;
S.push({stop:0,title:"Registered mail or postcard?",
 story:"Before Alice sends anything, she picks a delivery service from the layer below. The Internet offers two: <b>TCP</b> and <b>UDP</b>. One of her letters is going to get lost on the way. Let's see what each service does about it.",
 ask:{q:"Letter 2 gets lost. Which service notices and sends it again?",opts:["TCP","UDP","Both","Neither"],ans:0,why:"TCP is reliable: receipts come back and lost letters are resent, in order. UDP drops the card in the box and hopes."},
 body(el){
  const holder=slot();
  const steps=[[{from:"a",to:"b",tag:"letter 1",cap:"TCP: Alice sends letter 1 by registered mail."},{from:"b",to:"a",tag:"receipt 1",cap:"Bob sends back a receipt (an ACK)."},{from:"a",to:"b",tag:"letter 2",lost:true,cap:"Letter 2 gets lost on the road!"},{from:"a",to:"a",tag:"no receipt…",cap:"No receipt arrives. Alice's TCP waits, then decides it was lost."},{from:"a",to:"b",tag:"letter 2 again",cap:"TCP resends letter 2 for her."},{from:"b",to:"a",tag:"receipt 2",cap:"Delivered, in order, nothing missing. That's <b>reliable transport</b>."}],
   [{from:"a",to:"b",tag:"postcard 1",card:true,cap:"UDP: Alice drops postcard 1 in the box. No handshake first."},{from:"a",to:"b",tag:"postcard 2",card:true,lost:true,cap:"Postcard 2 is lost."},{from:"a",to:"b",tag:"postcard 3",card:true,cap:"Postcard 3 arrives. Nobody resends 2. Bob may never know it existed."}]];
  const draw=()=>{holder.innerHTML="";holder.append(trip({h:200,nodes:{a:{x:110,y:110,label:"Alice"},b:{x:530,y:110,label:"Bob",color:"var(--blue)"}},steps:steps[tcpMode]}))};
  el.append(seg(["TCP: registered mail","UDP: postcard"],k=>{tcpMode=k;draw()},tcpMode),holder);draw();
  el.append(h(`<div class="note"><b>So why would anyone use UDP?</b> No handshake and no waiting means less delay. Video calls and games can lose a little data but hate waiting. Email, web pages and downloads can't lose a single byte, so they use TCP. Neither service promises timing or throughput, and plain TCP isn't secret: <b>TLS</b> adds a sealed, tamper-proof envelope on top.</div>`))},
 take:"TCP: connection setup, reliable, in order, flow and congestion control. UDP: no setup, no guarantees, but fast and simple.",
 penny:"Watch letter 2 closely."});

S.push({stop:1,title:"Alice writes her first HTTP letter",
 story:"Alice types <b>www-net.cs.umass.edu/kurose_ross/index.html</b>. Her browser writes a request in plain text, line by line, and Penny carries it to the web server on port 80. The server is <b>stateless</b>: it reads the letter, replies, and forgets Alice.",
 ask:{q:"Alice asks for a page that doesn't exist. What will the reply start with?",opts:["200 OK","404 Not Found","301 Moved Permanently"],ans:1,why:"Every response begins with a status line. 404 means the document isn't on this server."},
 body(el){
  const pick=h(`<div class="row"><select aria-label="Method"><option>GET</option><option>POST</option><option>HEAD</option></select><select aria-label="Page"><option value="/kurose_ross/index.html">/kurose_ross/index.html</option><option value="/old-page.html">/old-page.html</option><option value="/no-such-file.html">/no-such-file.html</option><option value="garbled">(a scribbled, unreadable letter)</option></select></div>`);
  const [mSel,pSel]=$$("select",pick);
  const req=h(`<div class="letter"></div>`),holder=slot(),res=h(`<div class="letter" hidden></div>`),why=h(`<div class="note" hidden></div>`);
  el.append(h(`<p>Choose what Alice asks for, then send the letter:</p>`),pick,req,holder,res,why);
  const render=()=>{const m=mSel.value,p=pSel.value;res.hidden=true;why.hidden=true;
   req.innerHTML=p==="garbled"?`<span class="r">GRT</span> /kurose_ross/ HTTP/1.1  ??\nHost<span class="r">;;</span> www-net.cs.umass.edu`:`<span class="k">${m}</span> ${p} HTTP/1.1\\r\\n\n<span class="k">Host:</span> www-net.cs.umass.edu\\r\\n\n<span class="k">User-Agent:</span> Firefox/3.6.10\\r\\n\n<span class="k">Accept-Language:</span> en-us,en;q=0.5\\r\\n\n<span class="k">Connection:</span> keep-alive\\r\\n\n\\r\\n`+(m==="POST"?"name=alice&amp;course=networks":"");
   let code,extra="",c="g",txt;
   if(p==="garbled"){code="400 Bad Request";c="r";txt="The server couldn't understand the request message."}
   else if(p==="/old-page.html"){code="301 Moved Permanently";c="k";extra=`<span class="k">Location:</span> /kurose_ross/index.html\\r\\n\n`;txt="The page moved. The <b>Location:</b> header is the forwarding address, and the browser follows it."}
   else if(p==="/no-such-file.html"){code="404 Not Found";c="r";txt="The requested document isn't on this server."}
   else{code="200 OK";txt=m==="HEAD"?"HEAD asks for the headers only, without the page itself.":m==="POST"?"POST carries form input in the body of the request.":"Success. The page is inside this response. (GET can also carry form input in the URL, after a <b>?</b>.)"}
   holder.innerHTML="";holder.append(trip({h:190,nodes:{a:{x:100,y:100,label:"Alice's browser"},s:{x:530,y:100,kind:"office",label:"Web server",sub:"port 80"}},steps:[{from:"a",to:"s",tag:p==="garbled"?"???":`${m} ${p.split("/").pop()}`,cap:"Penny carries the request over a TCP connection to port 80."},{from:"s",to:"a",tag:code,cap:`The server replies: <b>${code}</b>.`}],
    onDone(){res.hidden=false;why.hidden=false;res.innerHTML=`HTTP/1.1 <span class="${c}">${code}</span>\\r\\n\n<span class="k">Date:</span> Wed, 28 Oct 2026 20:00:00 GMT\\r\\n\n<span class="k">Server:</span> Apache/2.0.52 (CentOS)\\r\\n\n${extra}<span class="k">Content-Type:</span> text/html; charset=ISO-8859-1\\r\\n\n\\r\\n${code==="200 OK"&&m!=="HEAD"?"&lt;html&gt; ...the page... &lt;/html&gt;":""}`;why.innerHTML=`<b>${code}.</b> ${txt}`;say(code==="200 OK"?"Delivered!":"Try another page to see a different reply.")}}))};
  mSel.onchange=render;pSel.onchange=render;render()},
 take:"HTTP request = request line (method, URL, version) + header lines + blank line + optional body. Response = status line + headers + the object. Other codes: 304 Not Modified, 505 HTTP Version Not Supported.",
 penny:"Pick a page, then send the letter. Try the missing one!"});

let hMode=0;
S.push({stop:1,title:"One page, four deliveries",
 story:"The page Alice opened has <b>3 images</b>. A web page is a base HTML file plus every object it references, so the browser needs 4 objects. Before each request, TCP knocks on the door and waits for an answer: that's one <b>round trip (RTT)</b>.",
 ask:{q:"With non-persistent HTTP (a new TCP connection for every object), how many round trips does it take?",opts:["4","8","12"],ans:1,why:"Each object costs 2 RTT: one to open the connection, one for the request and reply. 4 objects × 2 = 8 RTT."},
 body(el){
  const holder=slot();
  const mk=k=>{const st=[];const objs=["page.html","img1","img2","img3"];
   if(k===0){objs.forEach((o,j)=>{st.push({from:"a",to:"s",tag:"knock (TCP)",cap:`Object ${j+1}: open a new TCP connection.`},{from:"s",to:"a",tag:"come in",cap:"The server accepts. One RTT gone already."},{from:"a",to:"s",tag:`GET ${o}`,cap:`Now ask for ${o}.`},{from:"s",to:"a",tag:o,cap:`${o} arrives, and the connection is <b>closed</b>.`+(j===3?" Total: <b>8 RTT</b>.":"")})})}
   else st.push({from:"a",to:"s",tag:"knock (TCP)",cap:"Open one TCP connection."},{from:"s",to:"a",tag:"come in",cap:"Accepted. 1 RTT."},{from:"a",to:"s",tag:"GET page.html",cap:"Ask for the base page."},{from:"s",to:"a",tag:"page.html",cap:"The page arrives. The connection <b>stays open</b>."},{from:"a",to:"s",tag:"GET img1 img2 img3",cap:"Ask for all three images at once (pipelining) on the same connection."},{from:"s",to:"a",tag:"3 images",cap:"All three arrive. Total: <b>3 RTT</b> instead of 8."});
   return st};
  const draw=()=>{holder.innerHTML="";holder.append(trip({h:190,counter:i=>`Round trips: ${Math.floor((i+1)/2)}`,nodes:{a:{x:100,y:100,label:"Alice's browser"},s:{x:530,y:100,kind:"office",label:"Web server"}},steps:mk(hMode),onDone(){say(hMode?"Persistent HTTP (HTTP/1.1) keeps the door open. Much faster!":"So many knocks! Now try persistent.")}}))};
  el.append(seg(["Non-persistent","Persistent (HTTP/1.1)"],k=>{hMode=k;draw()},hMode),holder);draw()},
 take:"Non-persistent: 2 RTT + transmit time per object, plus OS overhead for every connection. Persistent (HTTP/1.1): the server leaves the connection open, so all referenced objects can arrive in as little as one more RTT.",
 penny:"Count the round trips in the yellow box. Try Play all!"});

S.push({stop:1,title:"How does Amazon remember Alice?",
 story:"Alice adds a book to her cart, closes the tab, and comes back a week later. The cart is still there. But HTTP is stateless: the server forgets everyone the moment it replies.",

  steps:[{from:"a",to:"s",tag:"GET (no card)",cap:"First visit. Alice's request carries no cookie."},{from:"s",to:"db",tag:"new ID 1678",cap:"The server creates ID <b>1678</b> and a database entry for it."},{from:"s",to:"a",tag:"Set-cookie: 1678",card:true,cap:"The reply includes <b>Set-cookie: 1678</b>. Alice's browser files the card in its cookie file."},{from:"a",to:"s",tag:"cookie: 1678",card:true,cap:"One week later, every request shows the card: <b>cookie: 1678</b>."},{from:"s",to:"db",tag:"look up 1678",cap:"The server looks up 1678 and finds Alice's cart."},{from:"s",to:"a",tag:"your cart",cap:"A cookie-specific action: her cart is back."}]}));
  el.append(h(`<div class="note"><b>The catch.</b> A third-party cookie (say, from an ad network embedded on many sites) can follow Alice from site to site and build a profile. That's why the EU's GDPR treats cookies that can identify a person as personal data.</div>`))},
 take:"Four parts: a Set-cookie header in a response, a cookie header in later requests, a cookie file in the browser, and a database at the site. Used for carts, logins, recommendations, and tracking.",
 penny:"Watch the blue card. That's the cookie."});

S.push({stop:1,title:"A branch post office down the hall",
 story:"Alice's whole school shares one narrow road to the Internet: a <b>1.54 Mbps</b> access link. Students send 15 requests a second for 100 Kbit objects, which is 1.50 Mbps. The road is 97% full, and letters wait <b>minutes</b> in line.",
 ask:{q:"What's the cheapest fix?",opts:["Buy a 100× faster road (154 Mbps)","Put a small branch post office inside the school","Ask students to browse less"],ans:1,why:"A web cache (proxy server) keeps copies of popular objects. Hits never use the road."},
 body(el){
  el.append(trip({h:240,nodes:{a:{x:70,y:70,label:"Alice"},b:{x:70,y:195,label:"Bob",color:"var(--blue)"},c:{x:285,y:130,kind:"office",label:"school cache",color:"var(--green)"},o:{x:560,y:130,kind:"office",label:"origin server",sub:"2 s away"}},
   steps:[{from:"a",to:"c",tag:"GET logo.png",cap:"Alice's browser sends the request to the school's cache, not the origin."},{from:"c",to:"o",tag:"GET logo.png",cap:"The cache doesn't have it (a <b>miss</b>), so it asks the origin, acting as a client."},{from:"o",to:"c",tag:"logo.png",cap:"The origin sends it. The cache keeps a copy."},{from:"c",to:"a",tag:"logo.png",cap:"Alice gets her image."},{from:"b",to:"c",tag:"GET logo.png",cap:"Five minutes later Bob asks for the same image…"},{from:"c",to:"b",tag:"logo.png (hit!)",cap:"…and the cache answers straight away. A <b>hit</b>: milliseconds, and the narrow road isn't used."}]}));
  const sl=h(`<div><label for="hitRate">Now you run the cache. Hit rate: <span>0.40</span></label><input type="range" id="hitRate" min="0" max="0.9" step="0.05" value="0.4"></div>`);
  const mt=h(`<div class="meter"><div><div class="lbl">How full the road is</div><div class="big"></div><div class="gauge"><i></i></div></div><div><div class="lbl">Average wait for a page</div><div class="big"></div><div class="lbl"></div></div></div>`);
  el.append(sl,mt);
  const [uV,dV]=$$(".big",mt),g=mt.querySelector(".gauge i"),dn=$$(".lbl",mt)[2],inp=sl.querySelector("input");
  const calc=()=>{const hr=+inp.value;sl.querySelector("span").textContent=hr.toFixed(2);const u=(1-hr)*1.5/1.54;uV.textContent=u.toFixed(2);g.style.width=Math.min(100,u*100)+"%";g.style.background=u>.9?"var(--red)":u>.7?"var(--gold)":"var(--green)";
   if(u>.9){dV.textContent="minutes";dn.textContent="The queue on the road explodes"}else{dV.textContent=((1-hr)*2.01+hr*.005).toFixed(2)+" s";dn.textContent=`${Math.round((1-hr)*100)}% from origin (2.01 s), ${Math.round(hr*100)}% from cache`}};
  inp.oninput=()=>{calc();const v=+inp.value;if(v===0)say("No cache: 97% full. Letters wait minutes!");else if(Math.abs(v-.4)<.01)say("At 0.4: road 58% full, about 1.2 s per page. Better than the 154 Mbps road, and cheaper!")};calc();
  el.append(h(`<div class="note"><b>Is the copy still fresh?</b> The cache can ask the origin with <span class="mono">If-modified-since: &lt;date&gt;</span>. If nothing changed, the reply is <span class="mono">304 Not Modified</span> with no object inside. This is a <b>conditional GET</b>.</div>`))},
 take:"Caches cut response time and traffic on the access link, and let small content providers deliver content well. Hit rate 0.4 → link utilization 0.58 and ≈1.2 s delay.",
 penny:"Drag the hit rate to 0 and watch the road jam."});

let h2=0;
S.push({stop:1,title:"Stuck behind a giant parcel",

  el.append(seg(["HTTP/1.1","HTTP/2"],k=>{h2=k;paint()},h2),fr,ctl,out);paint();
  el.append(h(`<div class="note"><b>And HTTP/3?</b> HTTP/2 still uses one TCP connection, so one lost packet stalls every object. HTTP/3 runs over <b>QUIC on UDP</b>, adding security and per-object error and congestion control.</div>`))},

S.push({stop:2,title:"Alice writes to Bob",
 story:"With the page loaded, Alice remembers she owes Bob an email. Email has three parts: <b>user agents</b> (mail apps), <b>mail servers</b> (a mailbox per user plus a queue of outgoing mail), and <b>SMTP</b>, which servers use to push mail to each other over TCP port 25.",
 ask:{q:"Does Alice's laptop send the email straight to Bob's laptop?",opts:["Yes, directly","No, it goes through two mail servers","No, it goes through Bob's server only"],ans:1,why:"Alice's server queues it and delivers it to Bob's server, where it waits in his mailbox. Bob's laptop doesn't need to be on."},
 body(el){el.append(trip({h:240,nodes:{a:{x:70,y:120,label:"Alice's",sub:"mail app"},as:{x:240,y:120,kind:"office",label:"Alice's server",sub:"queue"},bs:{x:410,y:120,kind:"office",label:"Bob's server",sub:"mailboxes"},b:{x:575,y:120,label:"Bob's",sub:"mail app",color:"var(--blue)"}},
  steps:[{from:"a",to:"a",tag:"to: bob@someschool.edu",cap:"Alice writes the message in her mail app (user agent)."},{from:"a",to:"as",tag:"SMTP",cap:"Her app sends it to her mail server with SMTP. It waits in the <b>message queue</b>."},{from:"as",to:"bs",tag:"TCP connect :25",cap:"Alice's server, acting as an SMTP client, opens a TCP connection to Bob's server."},{from:"as",to:"bs",tag:"SMTP: message",cap:"The message travels over that connection."},{from:"bs",to:"bs",tag:"into Bob's mailbox",cap:"Bob's server puts it in <b>Bob's mailbox</b>. Bob's laptop can be asleep."},{from:"bs",to:"b",tag:"IMAP",cap:"Later, Bob's app fetches it with <b>IMAP</b> (or HTTP, for webmail like Gmail)."}],
  onDone(){say("Delivered! SMTP pushed it, IMAP let Bob pull it.")}}))},
 take:"SMTP pushes mail to the receiver's server. Retrieval is separate: IMAP keeps messages on the server in folders; webmail uses HTTP.",
 penny:"This is my favourite route!"});

S.push({stop:2,title:"Eavesdropping on two post offices",

 body(el){

  const N={1:"Phase 1, handshake: the client says hello.",3:"Phase 2, transfer. First the envelope: who it's from…",5:"…and who it's for.",7:"Now the letter itself.",11:"A dot alone on a line ends the message.",13:"Phase 3, closure."};
  const box=h(`<div class="smtp"></div>`),ctl=h(`<div class="row"><button class="btn alt">Next line</button><button class="btn ghost">Restart</button></div>`);let k=0;
  const add=()=>{if(k>=L.length)return;const d=document.createElement("div");d.className=L[k][0];d.textContent=L[k][0]+": "+L[k][1];box.append(d);box.scrollTop=1e6;if(N[k])say(N[k]);k++;ctl.children[0].disabled=k>=L.length};
  ctl.children[0].onclick=add;ctl.children[1].onclick=()=>{k=0;box.innerHTML="";ctl.children[0].disabled=false;add()};
  el.append(ctl,box);add();
  el.append(h(`<div class="note"><b>SMTP vs HTTP.</b> HTTP is <b>pull</b> (the client fetches); SMTP is <b>push</b> (the sender delivers). HTTP puts each object in its own response; SMTP sends many objects in one multipart message. SMTP uses persistent connections and needs 7-bit ASCII. The <span class="mono">To:</span>, <span class="mono">From:</span> and <span class="mono">Subject:</span> lines inside the message (RFC 2822) are different from SMTP's MAIL FROM and RCPT TO, which are like writing on the outside of the envelope.</div>`))},

let dq=0;
S.push({stop:3,title:"Penny can't read names",
 story:"Alice clicks a link to <b>gaia.cs.umass.edu</b>. But Penny's roads only understand numbers: IP addresses. Somebody has to translate the name. That's the job of <b>DNS</b>, a huge address book split across many servers worldwide.",

  const rec=[{from:"h",to:"l",tag:"gaia.cs.umass.edu?",cap:"Alice's computer asks its local DNS server."},{from:"l",to:"r",tag:"you find it",cap:"Local asks root, and hands over the whole job."},{from:"r",to:"t",tag:"you find it",cap:"Root asks the .edu TLD server."},{from:"t",to:"a",tag:"you find it",cap:"TLD asks the authoritative server."},{from:"a",to:"t",tag:"128.119.245.12",cap:"The answer starts its way back…"},{from:"t",to:"r",tag:"128.119.245.12",cap:"…up through TLD…"},{from:"r",to:"l",tag:"128.119.245.12",cap:"…through root (busy root!)…"},{from:"l",to:"h",tag:"128.119.245.12",cap:"…and to Alice. This puts a heavy load on the upper levels."}];

  el.append(seg(["Iterated query","Recursive query"],k=>{dq=k;draw()},dq),holder);draw();

S.push({stop:3,title:"Five minutes later…",
 story:"Alice clicks another link on the same site. Her computer needs the address of <b>gaia.cs.umass.edu</b> again.",
 ask:{q:"How many servers have to be asked this time?",opts:["All four again","Just the local DNS server","None, Penny remembers"],ans:1,why:"The local server cached the answer. It replies at once, until the record's TTL (time to live) runs out."},
 body(el){el.append(trip({h:200,nodes:{h:{x:90,y:110,label:"Alice"},l:{x:320,y:100,kind:"office",label:"local DNS",sub:"cache: gaia → 128.119.245.12",color:"var(--green)"},r:{x:560,y:100,kind:"office",label:"root & friends",color:"var(--muted)"}},
  steps:[{from:"h",to:"l",tag:"gaia.cs.umass.edu?",cap:"Alice asks the local server again."},{from:"l",to:"h",tag:"128.119.245.12 (cached)",cap:"Answered from the cache. Root, TLD, and authoritative servers aren't bothered at all."}],onDone(){say("Caching is why root servers aren't overwhelmed.")}}));

  const out=h(`<div class="letter"></div>`),RR={A:["relay1.bar.foo.com","145.37.93.126","Hostname → IP address. The everyday lookup."],NS:["foo.com","dns.foo.com","Domain → the hostname of its authoritative name server."],CNAME:["www.ibm.com","servereast.backup2.ibm.com","Nickname (alias) → the real, canonical name."],MX:["foo.com","mail.bar.foo.com","Domain → its SMTP mail server. That's how mail to bob@foo.com finds its way."]};

  $$("button",cards).forEach(b=>b.onclick=()=>{$$("button",cards).forEach(x=>x.setAttribute("aria-pressed",x===b));const r=RR[b.textContent];out.innerHTML=`(<span class="k">${r[0]}</span>, <span class="g">${r[1]}</span>, <span class="r">${b.textContent}</span>, ttl)\n\n${r[2]}`});
  el.append(h(`<p><b>What's inside the cache?</b> Resource records, each one <span class="mono">(name, value, type, ttl)</span>. Tap a type:</p>`),cards,out);$$("button",cards)[0].click()},
 take:"DNS queries and replies share one message format with a 16-bit ID. To add a domain, register it with a registrar, which puts NS and A records into the TLD server. DNSSEC protects against spoofed answers.",

S.push({stop:4,title:"One file, many friends",
 story:"Alice wants to share a big file with her classmates. Option one: send it from a single server. Option two: P2P, where every classmate who has some of it uploads too. Each classmate uploads at rate <b>u</b>, sending the whole file takes <b>1 hour</b> at that rate, and the server is 10× faster.",
 ask:{q:"As the class grows from 1 to 35 people, what happens to the P2P time?",opts:["Grows in a straight line","Levels off below 1 hour","Drops to zero"],ans:1,why:"Every new peer adds upload capacity, so P2P time levels off. The server alone has to send N copies, so its time keeps growing."},
 body(el){
  const sl=h(`<div><label for="nPeers">Number of classmates N: <span>10</span></label><input type="range" id="nPeers" min="1" max="35" value="10"></div>`);
  const mt=h(`<div class="meter"><div><div class="lbl">Server alone</div><div class="big"></div></div><div><div class="lbl">P2P</div><div class="big"></div></div></div>`);
  const ch=h(`<div class="chart"><svg viewBox="0 0 400 230" role="img" aria-label="Distribution time versus N"></svg></div>`);el.append(sl,mt,ch);
  const PC=ch.querySelector("svg"),W=400,H=230,ml=38,mr=12,mt0=14,mb=32,sx=n=>ml+n/35*(W-ml-mr),sy=v=>H-mb-v/3.5*(H-mt0-mb);
  for(let v=0;v<=3.5;v+=.5){svgEl("line",{x1:ml,x2:W-mr,y1:sy(v),y2:sy(v),stroke:"var(--line)"},PC);svgEl("text",{x:ml-6,y:sy(v)+4,"text-anchor":"end","font-size":10,style:"fill:var(--muted)"},PC).textContent=v}
  for(let n=0;n<=35;n+=5)svgEl("text",{x:sx(n),y:H-mb+16,"text-anchor":"middle","font-size":10,style:"fill:var(--muted)"},PC).textContent=n;
  svgEl("text",{x:(W+ml)/2,y:H-2,"text-anchor":"middle","font-size":11,style:"fill:var(--ink)"},PC).textContent="N (people)";
  svgEl("text",{x:ml+4,y:10,"font-size":10,style:"fill:var(--muted)"},PC).textContent="hours";
  const cs=n=>n/10,pp=n=>Math.max(.1,n/(10+n));let a="",b="";for(let n=0;n<=35;n+=.5){a+=`${sx(n)},${sy(cs(n))} `;b+=`${sx(n)},${sy(pp(n))} `}
  svgEl("polyline",{points:a,fill:"none",stroke:"var(--red)","stroke-width":3},PC);svgEl("polyline",{points:b,fill:"none",stroke:"var(--blue)","stroke-width":3},PC);
  svgEl("text",{x:sx(21),y:sy(2.8),"font-size":12,"font-weight":600,style:"fill:var(--red)"},PC).textContent="server alone";
  svgEl("text",{x:sx(28),y:sy(1.05),"font-size":12,"font-weight":600,style:"fill:var(--blue)"},PC).textContent="P2P";
  const vl=svgEl("line",{y1:mt0,y2:H-mb,stroke:"var(--muted)","stroke-dasharray":"3 3"},PC),d1=svgEl("circle",{r:5,fill:"var(--red)",stroke:"var(--card)","stroke-width":2},PC),d2=svgEl("circle",{r:5,fill:"var(--blue)",stroke:"var(--card)","stroke-width":2},PC);
  const inp=sl.querySelector("input"),[c1,c2]=$$(".big",mt);
  const up=()=>{const n=+inp.value;sl.querySelector("span").textContent=n;c1.textContent=cs(n).toFixed(2)+" h";c2.textContent=pp(n).toFixed(2)+" h";vl.setAttribute("x1",sx(n));vl.setAttribute("x2",sx(n));d1.setAttribute("cx",sx(n));d1.setAttribute("cy",sy(cs(n)));d2.setAttribute("cx",sx(n));d2.setAttribute("cy",sy(pp(n)))};
  inp.oninput=()=>{up();if(+inp.value===35)say("35 people: 3.5 hours from one server, under 0.8 hours with P2P!")};up();
  el.append(h(`<div class="letter" style="font-size:.85rem">server alone:  D ≥ max{ N·F/u<sub>s</sub> , F/d<sub>min</sub> }
P2P:           D ≥ max{ F/u<sub>s</sub> , F/d<sub>min</sub> , N·F/(u<sub>s</sub> + Σu<sub>i</sub>) }</div>`))},
 take:"Client–server time grows linearly with N. P2P time is bounded because total upload capacity grows with N too.",
 penny:"Drag N all the way to 35."});

S.push({stop:4,title:"Which piece should Alice ask for?",
 story:"Alice joins a <b>BitTorrent</b> swarm. The file is cut into 256 KB chunks. A <b>tracker</b> told her which peers are in the torrent, and her neighbors send lists of the chunks they hold. She already has chunks 0 and 5.",
 ask:{q:"Which missing chunk should she request first?",opts:["The lowest-numbered one","The one fewest neighbors have","A random one"],ans:1,why:"Rarest first. If the only peer with a rare chunk leaves, nobody can finish."},
 body(el){
  const BT=[{n:"Bob",c:[1,2,3,5,7]},{n:"Carol",c:[0,1,3,4,7]},{n:"Dave",c:[1,3,5,6,7]},{n:"Eve",c:[1,2,3,4,7]}];
  let al=new Set([0,5]),fresh=-1;
  const box=h(`<div class="peers"></div>`),cap=h(`<div class="note">Alice has chunks 0 and 5. The numbers under her row count how many neighbors have each chunk.</div>`),ctl=h(`<div class="row"><button class="btn">Request next chunk</button><button class="btn ghost">Start over</button></div>`);
  const cnt=()=>[...Array(8)].map((_,i)=>BT.filter(p=>p.c.includes(i)).length);
  const row=(nm,set,me)=>`<div class="peer${me?" me":""}"><div class="nm">${nm}</div><div><div class="chunks">${[...Array(8)].map((_,i)=>`<i class="${set.has(i)?(me&&i===fresh?"new":"have"):""}">${i}</i>`).join("")}</div>${me?`<div class="counts" style="margin-top:4px">${cnt().map(c=>`<span>${c}</span>`).join("")}</div>`:""}</div></div>`;
  const paint=()=>{box.innerHTML=row("Alice",al,true)+BT.map(p=>row(p.n,new Set(p.c))).join("");ctl.children[0].disabled=al.size===8};
  ctl.children[0].onclick=()=>{const c=cnt();let b=-1;for(let i=0;i<8;i++)if(!al.has(i)&&(b<0||c[i]<c[b]))b=i;al.add(b);fresh=b;cap.innerHTML=`Alice asks for chunk <b>${b}</b>: only ${c[b]} neighbor${c[b]>1?"s have":" has"} it (${BT.filter(p=>p.c.includes(b)).map(p=>p.n).join(", ")}).`+(al.size===8?" She has the whole file! She can leave, or stay and keep seeding for others.":"");paint();if(al.size===8)say("Done! Kind peers stay to seed.")};
  ctl.children[1].onclick=()=>{al=new Set([0,5]);fresh=-1;cap.textContent="Alice has chunks 0 and 5.";paint()};
  el.append(box,ctl,cap);paint();
  el.append(h(`<div class="note"><b>Who does Alice send to?</b> Tit-for-tat. She uploads to the <b>4 peers sending to her fastest</b>, re-evaluated every 10 s. Every 30 s she <b>optimistically unchokes</b> one random peer, giving newcomers a chance to join her top 4. Peers that upload more find better partners and finish sooner.</div>`))},
 take:"BitTorrent: tracker + torrent of peers, 256 KB chunks, rarest first, tit-for-tat. Peers may come and go (churn).",
 penny:"Click until Alice has all eight."});

S.push({stop:5,title:"Movie night",
 story:"Homework done. Alice opens Netflix. Streaming video is the biggest user of Internet bandwidth, and her Wi-Fi speed keeps changing as roommates come and go. Video is just 24–30 images a second, squeezed using repetition <b>inside</b> a frame (spatial) and <b>between</b> frames (temporal).",
 ask:{q:"Bandwidth drops halfway through the movie. Who decides to switch to lower quality?",opts:["The Netflix server","Alice's player, the client","Her Internet provider"],ans:1,why:"With DASH, the client is in charge: it measures bandwidth and picks each chunk's quality from a list called the manifest."},
 body(el){
  el.append(trip({h:200,nodes:{a:{x:90,y:110,label:"Alice's player"},s:{x:540,y:100,kind:"office",label:"video server",sub:"chunks at 5 rates"}},
   steps:[{from:"a",to:"s",tag:"GET manifest",cap:"The player first asks for the <b>manifest file</b>."},{from:"s",to:"a",tag:"manifest: rates + URLs",card:true,cap:"The manifest lists every version of every chunk: 240p, 360p, 720p, 1080p, 4K."},{from:"a",to:"s",tag:"chunk 1 @ 1080p",cap:"Bandwidth is good. The player asks for chunk 1 in 1080p."},{from:"s",to:"a",tag:"chunk 1 (1080p)",cap:"It goes into the <b>playout buffer</b>, which smooths out network delay jitter."},{from:"a",to:"s",tag:"chunk 2 @ 360p",cap:"A roommate starts a download and bandwidth drops. The player asks for chunk 2 in 360p."},{from:"s",to:"a",tag:"chunk 2 (360p)",cap:"Lower quality, but no freezing. The client chose when, which rate, and from where."}]}));
  const sl=h(`<div><label for="bw">Try it yourself. Alice's bandwidth: <span>3.0</span> Mbps</label><input type="range" id="bw" min="0.3" max="10" step="0.1" value="3"></div>`);
  const q=h(`<div class="quality"></div>`),o=h(`<div class="note"></div>`);el.append(sl,q,o);
  const R=[[.4,"240p"],[1,"360p"],[2.5,"720p"],[5,"1080p"],[8,"4K"]],inp=sl.querySelector("input");
  const up=()=>{const bw=+inp.value;sl.querySelector("span").textContent=bw.toFixed(1);let p=-1;R.forEach((r,i)=>{if(r[0]<=bw)p=i});q.innerHTML=R.map((r,i)=>`<div class="${i===p?"pick":i<p?"ok":""}" style="height:${22+i*19}%">${r[1]}<br>${r[0]} Mbps</div>`).join("");o.innerHTML=p<0?"<b>Too slow!</b> Even 240p can't keep up. The buffer drains and the spinner appears.":`<b>Next chunk: ${R[p][1]}</b>, the highest rate that fits.`};
  inp.oninput=up;up()},

 penny:"Slide the bandwidth up and down."});

let cdn=0;
S.push({stop:5,title:"Why the movie doesn't come from California",
 story:"Alice is in Colombo. Netflix's main servers are thousands of kilometres away, and millions of people are watching at the same time.",
 ask:{q:"Where does Alice's movie actually come from?",opts:["One mega-server in California","A copy stored on a server near her","Her neighbor's laptop"],ans:1,why:"Content distribution networks (CDNs) store copies of popular videos on many servers worldwide, close to viewers."},
 body(el){
  const holder=slot();
  const nodes={a:{x:80,y:200,label:"Alice",sub:"Colombo"},n:{x:320,y:60,kind:"office",label:"netflix.com",sub:"accounts + manifests",color:"var(--red)"},far:{x:560,y:70,kind:"office",label:"one big server",sub:"California",color:"var(--muted)"},near:{x:330,y:205,kind:"office",label:"CDN node",sub:"inside her ISP",color:"var(--green)"}};
  const st=[[{from:"a",to:"far",tag:"play",cap:"Without a CDN, every request crosses the world to one server."},{from:"far",to:"a",tag:"chunk 1",cap:"Long path, many congested links, and the same video sent millions of times. If that server fails, everyone's movie stops."}],
   [{from:"a",to:"n",tag:"play 'Stranger Things'",cap:"Alice picks a show on netflix.com."},{from:"n",to:"a",tag:"manifest: CDN servers",card:true,cap:"Netflix replies with a manifest naming copies on several CDN servers. (DNS can also redirect her to a nearby one.)"},{from:"a",to:"near",tag:"chunk 1",cap:"Her player picks the closest, least busy copy."},{from:"near",to:"a",tag:"chunk 1",cap:"Short trip, fast start. If this path gets congested, the player switches server or rate."}]];
  const draw=()=>{holder.innerHTML="";holder.append(trip({h:270,nodes,steps:st[cdn]}))};
  el.append(seg(["One big server","With a CDN"],k=>{cdn=k;draw();say(k?"Copies in a warehouse near you!":"Watch how far that letter goes.")},cdn),holder);draw();
  el.append(h(`<div class="note"><b>Two strategies.</b> <b>Enter deep</b>: put small servers inside many access networks, close to users (Akamai: 240,000+ servers in 120+ countries). <b>Bring home</b>: fewer, larger clusters near access networks (Limelight). Delivering well over a congested Internet like this is the over-the-top (OTT) challenge.</div>`))},
 take:"A CDN stores copies of content at nodes spread across the world. The client is sent to a nearby copy and can switch if the path gets congested.",
 penny:"Compare the two routes."});

let sk=0;
S.push({stop:6,title:"Alice builds her own post office",
 story:"For her assignment, Alice writes a tiny app: the client sends a sentence, and the server shouts it back in CAPITALS. The program talks to the network through a <b>socket</b>, the door slot between the app and the transport layer. She can build it with UDP or TCP.",
 ask:{q:"With UDP, where does the server's address go?",opts:["On every single packet","Set once when connecting","Nowhere, the network figures it out"],ans:0,why:"UDP has no connection, so the sender attaches the destination IP and port to each packet. TCP connects once, then just sends."},
 body(el){
  const holder=slot();
  const st=[[{from:"c",to:"s",tag:"'hi' → (server, 12000)",card:true,cap:"<span class='mono'>sendto()</span>: the client attaches the server's IP and port to the packet. No handshake."},{from:"s",to:"c",tag:"'HI' → (client IP, port)",card:true,cap:"<span class='mono'>recvfrom()</span> told the server who sent it, so it can reply with <span class='mono'>sendto()</span>."}],
   [{from:"c",to:"w",tag:"connect()",cap:"The client knocks on the server's <b>welcoming socket</b> (port 12000)."},{from:"w",to:"n",tag:"accept()",cap:"<span class='mono'>accept()</span> opens a <b>brand-new socket</b> just for this client. The welcoming door stays open for others."},{from:"c",to:"n",tag:"'hi'",cap:"Now the client just calls <span class='mono'>send()</span>. No address needed."},{from:"n",to:"c",tag:"'HI'",cap:"The server replies on the new socket, then closes it, but not the welcoming one."}]];
  const nodes=[{c:{x:100,y:120,label:"client"},s:{x:540,y:120,kind:"door",num:"12000",label:"UDP socket",color:"var(--soft-gold)"}},{c:{x:100,y:120,label:"client"},w:{x:540,y:55,kind:"door",num:"12000",label:"welcoming socket",color:"var(--soft-gold)"},n:{x:540,y:185,kind:"door",num:"new",label:"connection socket",color:"var(--soft-green)"}}];
  const CODE=[`from socket import *
serverName = 'hostname'
serverPort = 12000
clientSocket = socket(AF_INET, SOCK_DGRAM)    # UDP socket
message = input('Input lowercase sentence:')
# attach server name and port to EVERY message
clientSocket.sendto(message.encode(), (serverName, serverPort))
modifiedMessage, serverAddress = clientSocket.recvfrom(2048)
print(modifiedMessage.decode())
clientSocket.close()

# --- UDP server ---
serverSocket = socket(AF_INET, SOCK_DGRAM)
serverSocket.bind(('', serverPort))
while True:
    message, clientAddress = serverSocket.recvfrom(2048)
    serverSocket.sendto(message.decode().upper().encode(), clientAddress)`,
`from socket import *
serverName = 'servername'
serverPort = 12000
clientSocket = socket(AF_INET, SOCK_STREAM)   # TCP socket
clientSocket.connect((serverName, serverPort))
sentence = input('Input lowercase sentence:')
clientSocket.send(sentence.encode())          # no address needed
modifiedSentence = clientSocket.recv(1024)
print('From Server:', modifiedSentence.decode())
clientSocket.close()

# --- TCP server ---
serverSocket = socket(AF_INET, SOCK_STREAM)
serverSocket.bind(('', serverPort))
serverSocket.listen(1)                        # welcoming socket
while True:
    connectionSocket, addr = serverSocket.accept()   # NEW socket
    sentence = connectionSocket.recv(1024).decode()
    connectionSocket.send(sentence.upper().encode())
    connectionSocket.close()`];
  const pre=h(`<pre class="code"></pre>`);
  const hl=s=>esc(s).replace(/('[^']*')/g,'<span class="s">$1</span>').replace(/(#.*)$/gm,'<span class="c">$1</span>').replace(/\b(from|import|while|True)\b/g,'<span class="k">$1</span>');
  const draw=()=>{holder.innerHTML="";holder.append(trip({h:250,nodes:nodes[sk],steps:st[sk]}));pre.innerHTML=hl(CODE[sk])};
  el.append(seg(["UDP","TCP"],k=>{sk=k;draw()},sk),holder,h(`<p><b>The real code</b> (Python 3, from the slides):</p>`),pre);draw();
  const tryit=h(`<div><label for="sockIn">Try Alice's server. Type a lowercase sentence:</label><div class="row" style="margin-top:6px"><input type="text" id="sockIn" value="hello penny" style="flex:1;min-width:0"><button class="btn">Send</button></div><div class="letter" style="margin-top:10px">The server is ready to receive</div></div>`);
  const inp=tryit.querySelector("input");
  const go=()=>{const v=inp.value||"(empty)";tryit.querySelector(".letter").innerHTML=`<span class="k">client →</span> ${esc(v)}\n<span class="g">server →</span> ${esc(v.toUpperCase())}`;say("Shouted back in capitals. That's the whole app!")};
  tryit.querySelector("button").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});el.append(tryit)},
 take:"UDP: SOCK_DGRAM, no connection, address on every packet, may be lost or out of order. TCP: SOCK_STREAM, connect/accept handshake, a new server socket per client, reliable in-order byte stream.",
 penny:"Watch for the new door that TCP opens."});

const Q=[
 ["A web browser fetching a page hires which transport service?",["UDP","TCP","IMAP"],1,"HTTP runs over TCP: every byte of the page must arrive."],
 ["HTTP is \"stateless\". What does that mean?",["It never uses TCP","The server keeps no memory of past requests","Responses have no status line"],1,"The server forgets you after each reply. Cookies are the workaround."],
 ["Which status code means \"document not found on this server\"?",["200","301","404","505"],2,"404 Not Found."],
 ["How many RTTs does each object cost with non-persistent HTTP (ignoring transmit time)?",["1","2","3"],1,"One RTT to open TCP, one for the request and reply."],
 ["With the school's cache at a 0.4 hit rate, how full is the access link?",["0.97","0.58","0.40"],1,"0.6 × 1.50 Mbps = 0.9 Mbps, and 0.9 / 1.54 ≈ 0.58."],
 ["SMTP is ___, HTTP is ___.",["pull, push","push, pull","push, push"],1,"The sender's server pushes mail; a browser pulls pages."],
 ["Bob reads mail stored on his server using…",["SMTP","IMAP (or HTTP webmail)","DNS"],1,"SMTP only delivers to Bob's server. IMAP or HTTP retrieves it."],
 ["In an iterated DNS query, who does the local server ask first (nothing cached)?",["Authoritative server","A root server","A TLD server"],1,"Root first, then TLD, then authoritative."],
 ["Which DNS record type names a domain's mail server?",["A","NS","CNAME","MX"],3,"MX = mail exchange."],
 ["In BitTorrent, which missing chunk does Alice request first?",["Lowest-numbered","The rarest among her neighbors","A random one"],1,"Rarest first."],
 ["In DASH, who decides which encoding rate to request next?",["The CDN","The video server","The client"],2,"The client, using the manifest."],
 ["What does a TCP server's accept() return?",["The client's message","A new socket for that client","Its own port number"],1,"The welcoming socket keeps listening; accept() returns a new connection socket."]];
let qi=0,res=[];
S.push({stop:7,title:"Penny's sorting test",
 story:"Midnight. Alice has sent a web request, emailed Bob, looked up an address, shared a file, watched a movie, and built a server. Now it's your turn: sort these twelve letters into the right pigeonholes.",
 noAsk:true,
 body(el){
  const c=h(`<div></div>`);el.append(c);
  const render=()=>{
   if(qi>=Q.length){const sc=res.filter(Boolean).length;c.innerHTML=`<div class="scoreline">${res.map(r=>`<i class="${r?"r":"w"}"></i>`).join("")}</div><div class="qtext">You sorted ${sc} of ${Q.length} letters correctly!</div><p>${sc===Q.length?"Perfect delivery. You know the application layer.":sc>=9?"Great work. Go back to the scenes behind any red ones.":"Good start. Revisit the scenes for the red ones and try again."}</p><div class="row" style="margin-top:14px"><button class="btn">Sort again</button></div>`;c.querySelector("button").onclick=()=>{qi=0;res=[];render()};say(sc===Q.length?"Perfect! You've earned every stamp.":`${sc} of ${Q.length}! Every delivery teaches something.`);markDone(7);return}
   const [q,o,a,w]=Q[qi];
   c.innerHTML=`<div class="scoreline">${Q.map((_,i)=>`<i class="${i<res.length?(res[i]?"r":"w"):""}"></i>`).join("")}</div><div class="kicker">Letter ${qi+1} of ${Q.length}</div><div class="qtext">${esc(q)}</div><div class="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("")}</div><div class="verdict"></div>`;
   $$(".opt",c).forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===a;res.push(ok);$$(".opt",c).forEach(x=>{x.disabled=true;if(+x.dataset.i===a)x.classList.add("right")});if(!ok)b.classList.add("wrong");
    c.querySelector(".verdict").innerHTML=`<p class="note"><b>${ok?"Right address!":"Return to sender."}</b> ${esc(w)}</p><div class="row" style="margin-top:12px"><button class="btn alt">${qi===Q.length-1?"See results":"Next letter"}</button></div>`;
    c.querySelector(".verdict button").onclick=()=>{qi++;render()};say(ok?"Nice sorting!":"Close! Read the note and keep going.")})};
  render()},
 penny:"Take your time. Every answer comes with a note."});

/* ---------- storybook controller ---------- */
let cur=Math.min(S.length-1,Math.max(0,+store.get("ch2-scene",0)||0));
const answered=store.get("ch2-answered",{});
const doneStops=new Set(store.get("ch2-stops",[]));
const route=$("#route");
STOPS.forEach((n,i)=>{const b=document.createElement("button");b.className="stop-btn";b.innerHTML=`<b>${i+1}</b><span>${n}</span>`;b.setAttribute("aria-label",`Stop ${i+1}: ${n}`);b.onclick=()=>go(S.findIndex(s=>s.stop===i));route.append(b)});
function markDone(stop){if(doneStops.has(stop))return;doneStops.add(stop);store.set("ch2-stops",[...doneStops]);paintRoute()}
function paintRoute(){$$(".stop-btn").forEach((b,i)=>{b.classList.toggle("here",S[cur].stop===i);b.classList.toggle("done",doneStops.has(i))});$("#trail").style.width=((cur+1)/S.length*100)+"%"}
function go(k){cur=Math.max(0,Math.min(S.length-1,k));store.set("ch2-scene",cur);render();const top=$("#stage").getBoundingClientRect().top+scrollY-12;if(scrollY>top)scrollTo({top,behavior:reduce?"auto":"smooth"})}
function render(){
  const s=S[cur],stage=$("#stage");
  const same=S.filter(x=>x.stop===s.stop),idx=same.indexOf(s)+1;
  const el=h(`<article class="scene"><p class="kicker">Stop ${s.stop+1} · ${STOPS[s.stop]}${same.length>1?` · scene ${idx} of ${same.length}`:""}</p><h2>${s.title}</h2><p class="story">${s.story}</p></article>`);
  const reveal=h(`<div class="reveal"></div>`);
  let built=false;
  const finish=()=>{reveal.hidden=false;if(!built){built=true;s.body(reveal);if(s.take)reveal.append(h(`<div class="takeaway"><b>Postcard to remember:</b> ${s.take}</div>`))}
    if(s.stop!==7&&(cur===S.length-1||S[cur+1].stop!==s.stop))markDone(s.stop)};
  stage.innerHTML="";
  if(s.noAsk){el.append(reveal);stage.append(el);finish()}
  else{
    const ask=h(`<div class="ask"><div class="q">${s.ask.q}</div><div class="opts">${s.ask.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div class="verdict"></div></div>`);
    reveal.hidden=true;el.append(ask,reveal);stage.append(el);
    const settle=(pick,quiet)=>{const ok=pick===s.ask.ans;$$(".opt",ask).forEach(x=>{x.disabled=true;if(+x.dataset.i===s.ask.ans)x.classList.add("right")});if(!ok)$$(".opt",ask)[pick].classList.add("wrong");
      ask.querySelector(".verdict").innerHTML=`<b>${ok?"You got it!":"Good guess, but no."}</b> ${s.ask.why} <b>Let's watch it happen ↓</b>`;
      finish();if(!quiet)say(ok?"Spot on! Now watch the letter travel.":"Surprise! Let's watch and find out why.")};
    $$(".opt",ask).forEach(b=>b.onclick=()=>{answered[cur]=+b.dataset.i;store.set("ch2-answered",answered);settle(+b.dataset.i)});
    if(answered[cur]!=null&&answered[cur]<s.ask.opts.length)settle(answered[cur],true);
  }
  hintLine=s.penny||"";say(s.penny||"Make a guess!");
  $("#count").textContent=`Scene ${cur+1} of ${S.length}`;
  $("#prev").disabled=cur===0;$("#next").disabled=cur===S.length-1;
  $("#next").textContent=S[cur+1]&&S[cur+1].stop!==s.stop?`On to ${STOPS[S[cur+1].stop]} →`:"Next scene →";
  paintRoute();
}
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
render();
})();
</script>
