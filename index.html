<style>

* { box-sizing: border-box; }
body { background: var(--sky); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.65; }

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: auto; }

.list { display: grid; gap: 12px; }

  border: 6px solid transparent; border-image: repeating-linear-gradient(-45deg, var(--post-red) 0 10px, var(--paper) 10px 18px, var(--post-blue) 18px 28px, var(--paper) 28px 36px) 6;

.env:hover, .env:focus-visible { transform: translateY(-3px) rotate(-.4deg); }

footer { padding-block: 26px 40px; color: var(--muted); font-size: 14px; }

@media (max-width: 520px) {

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  { n: 7, title: "රැහැන් රහිත සහ ජංගම ජාල (Wireless & Mobile)", url: "chapters/chapter7.html",
    blurb: "නිතරම තැනින් තැනට යන කෙනෙකුට යොමු කිරීමේ ලිපින (Forwarding addresses) මගින් ලිපි බෙදා හැරීම.",
    q: "වළගම්බා සෑම සතියකම නිවස මාරු කරන අතර මාර්ග වෙනුවට ගුවන් තරංග (Radio) භාවිතා කරයි. ලිපිවලට තවමත් ඔහුව සොයාගත හැකිද?",
    opts: [
      { t: "ඔව්, යොමු කිරීමේ ලිපිනයක් (Forwarding address) මගින්", ok: true },
      { t: "නැත, ඔහුව සම්බන්ධ කරගත නොහැක", ok: false, hint: "ජංගම දුරකථන නිතරම ගමන් කළත් ඒවාට පණිවිඩ ලැබේ. එය සිදුවන්නේ කෙසේද?" },
      { t: "ඔහු නිවසේ රැඳී සිටියහොත් පමණි", ok: false, hint: "එසේ වුවහොත් ජංගම දුරකථනවලින් පලක් නැත." }
    ],
    answer: "රැහැන් රහිත සබඳතා ගුවන හරහා ලිපි යවන අතර, මුල් තැපැල් කාර්යාලය (Home network) ගමන් කරන්නන්ගේ නව ලිපිනය තබා ගනී. ලිපි පළමුව පැරණි නිවසට ගොස් එතැන් සිට වළගම්බා දැන් සිටින තැනට යොමු කෙරේ.",
    scene: () => `<div class="signs"><span class="sign">මුල් නිවස</span><span class="sign hit">යොමු කිරීම →</span><span class="sign">නව ස්ථානය</span></div>` },
  { n: 8, title: "ජාල ආරක්ෂාව (Security)", url: "chapters/chapter8.html",
    blurb: "මුද්‍රා තැබූ ලියුම් කවර, අත්සන් සහ එවන්නා සැබෑ අයෙකු බව තහවුරු කිරීම.",
    q: "අතරමගදී දනුජට ඔබේ ලිපිය විවෘත කිරීමට හෝ අනුර ලෙස පෙනී සිටීමට හැකිය. ඔබ එය වළක්වන්නේ කෙසේද?",
    opts: [
      { t: "රනිල්ට පමණක් විවෘත කළ හැකි අගුලකින් එය මුද්‍රා තබා, අත්සන් කිරීමෙන්", ok: true },
      { t: "ඉතා කුඩා අකුරින් ලිවීමෙන්", ok: false, hint: "ඕනෑකමින් බලන කෙනෙකුට එය තවමත් කියවිය හැක. ඒ වෙනුවට අගුලක් ගැන සිතන්න." },
      { t: "කිසිවෙකු එය නොබලනු ඇතැයි ප්‍රාර්ථනා කිරීමෙන්", ok: false, hint: "බලාපොරොත්තුව පමණක් ආරක්ෂාවක් නොවේ." }
    ],
    answer: "සංකේතනය (Encryption) මගින් ලියුම් කවරය අගුළු දමයි, ඩිජිටල් අත්සනකින් (Digital Signature) එය එව්වේ කවුදැයි ඔප්පු කරයි, සහ ගිනි පවුරු (Firewalls) තැපැල් කාර්යාලයේ දොරටුව ආරක්ෂා කරයි.",
    scene: () => `<div class="signs"><span class="sign hit">මුද්‍රා තැබූ</span><span class="sign">අත්සන් කළ</span><span class="sign">ආරක්ෂිත</span></div>` }
];

const store = {
  get() { try { return JSON.parse(localStorage.getItem("npo-opened") || "[]"); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem("npo-opened", JSON.stringify(v)); } catch (e) {} }
};
let opened = new Set(store.get());
let at = -1;
let view = "story";
let solved = false;

const card = document.getElementById("card");
const route = document.getElementById("route");
const envEl = document.getElementById("env");
const fill = document.getElementById("railFill");

const penny = `<svg viewBox="0 0 64 80" aria-hidden="true">
  <rect x="16" y="40" width="32" height="34" rx="10" fill="#2457c5"/>
  <circle cx="32" cy="24" r="14" fill="#f2c39b"/>
  <circle cx="37" cy="24" r="2" fill="#1c2a44"/>
  <path d="M33 31 q5 4 9 0" stroke="#1c2a44" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M17 20 q15 -16 30 0 z" fill="#d93b3b"/><rect x="30" y="17" width="24" height="4" rx="2" fill="#d93b3b"/>
  <path d="M19 24 q-4 9 2 15" stroke="#6b3e1f" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>`;
const say = (t) => `<div class="speaker">${penny}<div class="say"><b>තැපැල්කරු මහින්ද</b>${t}</div></div>`;

const STOP_X = (i) => 4 + (92 * i) / 7;
CHAPTERS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "stop"; b.type = "button"; b.textContent = c.n; b.style.left = STOP_X(i) + "%";
  b.setAttribute("aria-label", `නැවතුම ${c.n} වෙත යන්න: ${c.title}`);
  b.addEventListener("click", () => { view = "story"; solved = false; at = i; go(i, true); });
  b.dataset.i = i;
  route.appendChild(b);
});
function paintRoute() {
  const idx = Math.min(Math.max(at, 0), 7);
  envEl.style.left = STOP_X(idx) + "%";
  fill.style.width = at <= 0 ? "0%" : ((idx) / 7 * 100) + "%";
  [...route.querySelectorAll(".stop")].forEach((s, i) => {
    s.classList.toggle("past", at > i || at === 8);
    s.classList.toggle("here", at === i);
  });
  route.hidden = view === "map" || at < 0;
}
function go(i, instant) {
  at = i;
  if (instant) { envEl.style.transition = fill.style.transition = "none"; }
  paintRoute();
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => { envEl.style.transition = fill.style.transition = ""; }));
  render();
}
function travelTo(next) {
  envEl.classList.add("moving");
  at = next; paintRoute();
  setTimeout(() => { envEl.classList.remove("moving"); solved = false; render(); }, 1150);
}

function render() {
  if (view === "map") return renderMap();
  if (at === -1) return renderIntro();
  if (at === 8) return renderEnd();
  renderStop(at);
}

function renderIntro() {
  card.innerHTML = `
    <span class="kicker">නැවතුම් 8ක කතාවක්</span>
    <h1>ලිපියක් <span>මුළු ලෝකයම</span> හරහා යන්නේ කෙසේද?</h1>
    ${say("ආයුබෝවන්, මම මහින්ද! අනුර දුර සිටින ඔහුගේ මිතුරා වන රනිල්ට පණිවිඩයක් යැව්වා. එය ඇසිපිය හෙළන සැණින් ලැබුණා. අපි එක් ලිපියක් පසුපස ගොස් සෑම නැවතුමකදීම සැබවින්ම සිදුවූයේ කුමක්දැයි සොයා බලමු.")}
    <div class="row"><button class="btn" id="start" type="button">ලිපිය පසුපස යමු</button></div>`;
  document.getElementById("start").addEventListener("click", () => { route.hidden = false; solved = false; go(0, true); });
}

function renderStop(i) {
  const c = CHAPTERS[i];
  card.innerHTML = `
    <span class="kicker">8 න් ${c.n} වන නැවතුම · ${c.title}</span>
    <h2>${c.q}</h2>
    <div class="opts" id="opts">${c.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o.t}</button>`).join("")}</div>
    <p class="hint" id="hint">නිවැරදි යැයි සිතන පිළිතුර තෝරන්න.</p>
    <div id="after"></div>`;
  const hint = document.getElementById("hint");
  card.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
    const o = c.opts[+b.dataset.k];
    if (!o.ok) { b.classList.add("bad"); b.disabled = true; hint.textContent = o.hint; return; }
    b.classList.add("ok");
    card.querySelectorAll(".opt").forEach((x) => x.disabled = true);
    hint.textContent = "ඔබ එය නිවැරදිව තේරුම් ගත්තා!";
    solved = true;
    reveal(i);
  }));
}

function reveal(i) {
  const c = CHAPTERS[i];
  const last = i === 7;
  document.getElementById("after").innerHTML = `
    <div class="reveal">
      ${say(c.answer)}
      <div class="scene">${c.scene()}</div>
      <div class="row">
        <a class="btn blue" id="open" href="${c.url}">සම්පූර්ණ පාඩම කියවන්න</a>
        <button class="btn" id="send" type="button">${last ? "ලිපිය භාර දෙන්න" : "ලිපිය " + (c.n + 1) + " වන නැවතුමට යවන්න"}</button>
      </div>
    </div>`;
  document.getElementById("open").addEventListener("click", () => { opened.add(c.n); store.set([...opened]); });
  const send = document.getElementById("send");
  send.addEventListener("click", () => { send.disabled = true; travelTo(i + 1); });
  document.getElementById("after").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderEnd() {
  card.innerHTML = `
    <span class="kicker">බෙදා හැරියා!</span>
    <h2>රනිල් අනුරගේ ලිපිය කියෙව්වා!</h2>
    ${say("ඔබ විසින්ම සම්පූර්ණ ගමන් මග ගොඩනැගුවා. සෑම නැවතුමකටම අදාළව තවත් ක්‍රියාකාරකම් සහිත සම්පූර්ණ පරිච්ඡේදයක් ඇත. ඔබ ගවේෂණය කිරීමට කැමති ඕනෑම පරිච්ඡේදයක් තෝරන්න.")}
    <div class="row">
      <button class="btn" id="all" type="button">සියලුම පරිච්ඡේද විවෘත කරන්න</button>
      <button class="btn ghost" id="again" type="button">තවත් ලිපියක් යවන්න</button>
    </div>`;
  document.getElementById("all").addEventListener("click", () => { view = "map"; paintRoute(); render(); });
  document.getElementById("again").addEventListener("click", () => { solved = false; go(0, true); });
}

function renderMap() {
  route.hidden = true;
  card.innerHTML = `
    <span class="kicker">තැපැල් මාර්ගය</span>
    <h2>විවෘත කිරීමට පරිච්ඡේදයක් තෝරන්න</h2>
    <div class="dots" aria-label="8 න් ${opened.size} ක් විවෘත කර ඇත">${CHAPTERS.map((c) => `<i class="${opened.has(c.n) ? "on" : ""}"></i>`).join("")}</div>
    <p class="muted">ලිපි 8 න් ${opened.size} ක් විවෘත කර ඇත. ඔබ අලුත් නම් 1 වන පරිච්ඡේදයෙන් ආරම්භ කරන්න.</p>
    <div class="list">${CHAPTERS.map((c) => `
      <a class="env" href="${c.url}" data-n="${c.n}">
        <div class="n">${c.n}</div>
        <div><h3>${c.title}</h3><p>${c.blurb}</p></div>
        <span class="pm" ${opened.has(c.n) ? "" : "hidden"}>කියවා ඇත</span>
      </a>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="back" type="button">කතාවට ආපසු යන්න</button></div>`;
  card.querySelectorAll(".env").forEach((a) => a.addEventListener("click", () => {
    opened.add(+a.dataset.n); store.set([...opened]);
    a.querySelector(".pm").hidden = false;
  }));
  document.getElementById("back").addEventListener("click", () => { view = "story"; if (at === 8 || at < 0) { at = -1; paintRoute(); } else { paintRoute(); } render(); });
}

document.getElementById("toMap").addEventListener("click", () => { view = "map"; paintRoute(); render(); });

paintRoute();
render();
</script>
</body></html>
